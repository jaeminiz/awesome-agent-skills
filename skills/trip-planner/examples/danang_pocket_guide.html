<script>
'use strict';
const T = window.TRIP;
const main = document.getElementById('main');
const icon = (n, c='') => `<svg aria-hidden="true" class="${c}"><use href="#i-${n}"/></svg>`;
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flat = T.days.flatMap((d, di) => d.items.map((x, i) => ({ x, di, i, id: `${di}-${i}` })));
const byId = id => flat.find(e => e.id === id);

const storageKey = T.meta?.storageKey || 'pocket-guide-' + (T.meta?.city || 'trip').toLowerCase();
let state = { day: 0, view: 'timeline', query: '', filter: '전체' };
let saved = { done: {}, packing: {}, shopping: {}, rate: T.meta?.defaultRate || 100 };

try {
  const old = JSON.parse(localStorage.getItem(storageKey));
  if (old) {
    for (const k of ['done', 'packing', 'shopping']) if (old[k] && typeof old[k] === 'object') saved[k] = old[k];
    if (Number.isFinite(old.rate) && old.rate > 0) saved.rate = old.rate;
  }
} catch(e) {}

function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify(saved)); }
  catch(e) { toast('이 브라우저에서는 체크 상태를 저장할 수 없습니다.'); }
}

function toast(s) {
  const el = document.getElementById('toast');
  el.textContent = s;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.hidden = true, 3200);
}

const curSymbol = T.meta?.currencySymbol || '';
const curUnit = T.meta?.currencyUnit || 1;
const curRateLabel = T.meta?.currencyRateLabel || `1${curSymbol} =`;
const langName = T.meta?.langName || '현지어';
const langCode = T.meta?.langCode || 'en-US';

const curFmt = n => (curSymbol ? curSymbol + ' ' : '') + Math.round(n).toLocaleString('ko-KR') + (!curSymbol ? (T.meta?.currencyName || '') : '');
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';

function initHeader() {
  document.querySelector('#brand-title span').textContent = T.meta?.brand || '여행 포켓 가이드';
  const hero = document.getElementById('hero-section');
  hero.innerHTML = `
    <h1>${T.meta?.heroH1 || '도시에서<br>우리의 <em>일정.</em>'}</h1>
    <p>${T.meta?.period || ''}</p>
    <p class="meta">${T.meta?.summary || ''}<span class="desktop-note"> · 주머니 속 여행 가이드</span></p>
  `;
  const datesBar = document.getElementById('dates-bar');
  datesBar.innerHTML = T.days.map((d, i) => `
    <button role="tab" aria-selected="${i===0}" data-day="${i}">${esc(d.label)}<small>${esc(d.sub || '')}</small></button>
  `).join('');
}

function maps(place) {
  const q = encodeURIComponent(place);
  return `<div class="actions"><a class="action apple" target="_blank" rel="noopener noreferrer" href="https://maps.apple.com/?q=${q}">${icon('map')}Apple 지도</a><a class="action" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${q}">Google 지도</a></div>`;
}

function phrase(e, open=false) {
  const x = e.x;
  if (!x[6]) return '';
  return `<details class="disclosure" ${open?'open':''}><summary>${icon('chat')}${langName} 회화${icon('down','chevron')}</summary><div class="phrase-body"><div class="native-lang">${esc(x[6])}</div><div class="reading">${esc(x[7])}</div><div class="meaning">${esc(x[8])}</div>${phraseControls(e.id)}</div></details>`;
}

function phraseControls(id) {
  return `<div class="phrase-controls"><button data-speak="${id}" aria-label="발음 듣기">${icon('sound')}듣기</button><button data-big="${id}">크게 보기</button><button data-copy="${id}" aria-label="복사">${icon('copy')}</button></div>`;
}

function render() {
  document.body.dataset.view = state.view;
  document.querySelectorAll('[data-day]').forEach(b => {
    const isSel = +b.dataset.day === state.day;
    b.setAttribute('aria-selected', String(isSel));
    b.tabIndex = isSel ? 0 : -1;
  });
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.view === state.view ? 'page' : 'false'));
  if (state.view === 'timeline') timeline();
  else if (state.view === 'places') places();
  else if (state.view === 'phrases') phrases();
  else if (state.view === 'ready') ready();
}

function eventTimeline(entries) {
  return '<div class="timeline">' + entries.map(e => {
    const x = e.x;
    return '<article class="event ' + (saved.done[e.id] ? 'done' : '') + '" id="event-' + e.id + '"><div class="event-head"><div class="time">' + esc(x[0]) + (x[1] ? '–' + esc(x[1]) : '') + '<span class="type">' + esc(x[3]) + '</span></div><button class="check" data-done="' + e.id + '" aria-pressed="' + !!saved.done[e.id] + '" aria-label="' + esc(x[2]) + ' 완료 표시">' + icon('check') + '</button></div><h3>' + esc(x[2]) + '</h3><p>' + esc(x[5]) + '</p>' + maps(x[4]) + phrase(e) + '</article>';
  }).join('') + '</div>';
}

function timeline() {
  const d = T.days[state.day];
  const entries = flat.filter(e => e.di === state.day);
  const done = entries.filter(e => saved.done[e.id]).length;
  let next = entries.find(e => !saved.done[e.id]);

  main.innerHTML = `
    <div class="day-heading"><div><h2 class="section-title">${esc(d.title)}</h2><p class="sub">${esc(d.subtitle || '')}</p></div><span class="subtle">DAY ${state.day+1}</span></div>
    <div class="route">${esc(d.route || '')}</div>
    ${d.notice ? `<section class="tour-card"><h3>${esc(d.notice.title)}</h3><p>${d.notice.content}</p></section>` : ''}
    <div class="feature">
      <div class="tiny">${done === entries.length ? '오늘의 계획 체크 완료!' : '다음으로 확인할 일정'} · ${done}/${entries.length}</div>
      <h3>${next ? `${esc(next.x[0])} · ${esc(next.x[2])}` : '오늘의 모든 일정을 완료했습니다!'}</h3>
      <p>${next ? esc(next.x[4]) : '체크한 일정은 이 기기에 안전하게 저장됩니다.'}</p>
      <div class="progress" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${entries.length}" aria-label="일정 완료 수"><i style="width:${entries.length ? (done/entries.length*100) : 0}%"></i></div>
      ${next ? `<button data-jump="${next.id}">해당 일정으로 이동</button>` : ''}
    </div>
    ${eventTimeline(entries)}
    <button class="next-day" data-next="${(state.day + 1) % T.days.length}">${state.day < T.days.length - 1 ? '다음 날 일정 보기' : '1일차로 돌아가기'}${icon('chevron')}</button>
    ${footer()}
  `;
}

function footer() {
  return `<footer class="footer">${T.meta?.footer || '실시간 최저가·환율·미디어 큐레이션 반영 · 시간 및 요금은 현장 안내를 우선합니다.'}</footer>`;
}

function places() {
  const d = T.days[state.day];
  const categories = T.meta?.placeCategories || ['전체', '식사', '쇼핑', '관광', '투어', '이동'];
  main.innerHTML = `
    <h2 class="section-title">길 찾기는 한 번에.</h2>
    <p class="sub">DAY ${state.day + 1} · ${esc(d.title)}</p>
    ${T.hotel ? `<div class="panel"><div class="quick-hotel"><b>우리의 베이스캠프</b>${icon('bag')}</div><h3 style="margin-top:12px">${esc(T.hotel.name)}</h3><p class="note">${esc(T.hotel.address || '')}</p>${maps(T.hotel.name)}</div>` : ''}
    <label class="search">${icon('search')}<input id="query" type="search" placeholder="장소·메뉴 검색" aria-label="장소 검색" value="${esc(state.query)}"></label>
    <div class="chips" aria-label="장소 종류">${categories.map(v => `<button data-filter="${v}" class="${state.filter===v?'selected':''}" aria-pressed="${state.filter===v}">${v}</button>`).join('')}</div>
    <div id="places-results" class="places-grid"></div>
    ${footer()}
  `;
  placeResults();
}

function placeResults() {
  const q = state.query.toLowerCase();
  const entries = flat.filter(e => e.di === state.day && (state.filter === '전체' || e.x[3] === state.filter) && (e.x.join(' ').toLowerCase().includes(q)));
  const seen = new Set();
  const unique = entries.filter(e => { if (seen.has(e.x[4])) return false; seen.add(e.x[4]); return true; });
  document.getElementById('places-results').innerHTML = unique.length ? unique.map(e => `
    <article class="place"><span class="time">${esc(e.x[0])} <span class="type">${esc(e.x[3])}</span></span><h3>${esc(e.x[2])}</h3><p>${esc(e.x[4])}</p>${maps(e.x[4])}</article>
  `).join('') : '<p class="empty">검색 결과가 없습니다. 다른 단어로 검색해 보세요.</p>';
}

function phrases() {
  main.innerHTML = `
    <h2 class="section-title">필요한 순간, ${langName}.</h2>
    <p class="sub">읽거나, 크게 보여주거나, 원어민 발음으로 들어보세요.</p>
    <label class="search">${icon('search')}<input id="phrase-query" type="search" placeholder="택시·면세·주문·호텔 등 검색" aria-label="회화 검색" value="${esc(state.query)}"></label>
    <div id="phrases-results"></div>
    ${footer()}
  `;
  phraseResults();
}

function phraseResults() {
  const q = state.query.toLowerCase();
  const entries = flat.filter(e => e.di === state.day && e.x[6] && [e.x[2], e.x[6], e.x[7], e.x[8]].join(' ').toLowerCase().includes(q));
  document.getElementById('phrases-results').innerHTML = entries.length ? entries.map(e => `
    <article class="panel"><div class="time" style="color:var(--green);margin-bottom:12px">${esc(e.x[0])} · ${esc(e.x[2])}</div><div class="native-lang">${esc(e.x[6])}</div><div class="reading">${esc(e.x[7])}</div><div class="meaning">${esc(e.x[8])}</div>${phraseControls(e.id)}</article>
  `).join('') : '<p class="empty">검색 결과가 없습니다.</p>';
}

function checklist(items, key) {
  if (!items || !items.length) return '<p class="note">항목이 없습니다.</p>';
  return items.map((v, i) => {
    const text = Array.isArray(v) ? v[0] : v;
    const sub = Array.isArray(v) ? `${v[2] || ''} · ${v[1] || ''}` : '';
    return `<label class="listcheck"><input type="checkbox" data-list="${key}" data-index="${i}" ${saved[key][i] ? 'checked' : ''}><span>${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></label>`;
  }).join('');
}

function ready() {
  main.innerHTML = `
    <h2 class="section-title">가볍게 떠날 준비.</h2>
    <p class="sub">체크 상태와 환율은 현재 기기에 안전하게 보관됩니다.</p>
    <div class="panel"><h3>챙길 것 <span id="packing-count" class="type"></span></h3>${checklist(T.packing, 'packing')}</div>
    <div class="panel"><h3>쇼핑 위시리스트</h3>${checklist(T.shopping, 'shopping')}</div>
    <section class="panel">
      <h3>예상 총경비 & 환율 계산</h3>
      <p class="note">항공·숙박 제외 현지 경비 · 실시간 원화 자동 환산</p>
      <div id="budget-total" class="money"></div>
      <div class="rate"><label for="rate">${curRateLabel}</label><input id="rate" type="number" min="0.01" max="1000000" step="any" inputmode="decimal" value="${saved.rate}"><span>원</span></div>
      <div id="budget-rows" class="budget-grid"></div>
    </section>
    ${T.food && T.food.length ? `<div class="panel"><h3>일자별 식비 & 카페 예산</h3><div class="budget-grid">${T.food.map(([day, item, cost]) => `<div class="budget-row"><span>${esc(day)} · ${esc(item)}</span><b>${curFmt(cost)}</b></div>`).join('')}</div></div>` : ''}
    ${T.notes && T.notes.length ? `<section class="panel" id="notes"><h3>여행 주의사항 & 실전 팁</h3><div class="note-list">${T.notes.map(n => `<p>• ${esc(n)}</p>`).join('')}</div></section>` : ''}
    ${footer()}
  `;
  budget();
  counts();
}

function budget() {
  const r = saved.rate / curUnit;
  let totalLocal = 0;
  if (T.budget) {
    totalLocal = T.budget.reduce((acc, cur) => acc + cur[1], 0);
  }
  const totalWon = totalLocal * r;
  const totEl = document.getElementById('budget-total');
  if (totEl) totEl.innerHTML = won(totalWon);

  const rowsEl = document.getElementById('budget-rows');
  if (rowsEl && T.budget) {
    const travelers = T.meta?.travelerCount || 1;
    rowsEl.innerHTML = T.budget.map(([label, n]) => `
      <div class="budget-row"><span>${esc(label)}<small style="display:block;color:var(--muted)">${curFmt(n)}</small></span><b>${won(n * r)}</b></div>
    `).join('') + `
      <div class="budget-row" style="border-top:1px solid var(--line);padding-top:10px;font-weight:700"><span>1인당 예상 경비</span><b>${won(totalWon / travelers)}</b></div>
    `;
  }
}

function counts() {
  const el = document.getElementById('packing-count');
  if (el && T.packing) {
    const doneCount = T.packing.filter((_, i) => saved.packing[i]).length;
    el.textContent = `${doneCount}/${T.packing.length}`;
  }
}

function navigate(view) {
  state.view = view;
  state.query = '';
  state.filter = '전체';
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

document.querySelector('.tabbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.dataset.view) navigate(b.dataset.view);
});

document.querySelector('.dates').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.day === undefined) return;
  state.day = +b.dataset.day;
  state.query = '';
  render();
});

document.querySelector('.dates').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  const max = T.days.length - 1;
  state.day = e.key === 'Home' ? 0 : e.key === 'End' ? max : (state.day + (e.key === 'ArrowRight' ? 1 : max)) % T.days.length;
  render();
  document.querySelector(`[data-day="${state.day}"]`)?.focus();
});

document.getElementById('info').addEventListener('click', () => {
  navigate('ready');
  document.getElementById('notes')?.scrollIntoView({ behavior: 'smooth' });
});

main.addEventListener('input', e => {
  if (e.target.id === 'query') { state.query = e.target.value; placeResults(); }
  if (e.target.id === 'phrase-query') { state.query = e.target.value; phraseResults(); }
  if (e.target.id === 'rate') {
    const v = Number(e.target.value);
    if (Number.isFinite(v) && v > 0 && v <= 10000000) {
      saved.rate = v;
      persist();
      budget();
    }
  }
});

main.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.list) {
    saved[el.dataset.list][el.dataset.index] = el.checked;
    persist();
    counts();
  }
});

main.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.done) {
    saved.done[b.dataset.done] = !saved.done[b.dataset.done];
    persist();
    const opened = [...main.querySelectorAll('details[open]')].map(d => d.closest('article')?.id);
    const y = window.scrollY;
    render();
    opened.forEach(id => {
      const d = document.querySelector(`#${id} details`);
      if (d) d.open = true;
    });
    window.scrollTo({ top: y, behavior: 'instant' });
  }
  if (b.dataset.jump) {
    document.getElementById('event-' + b.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if (b.dataset.next !== undefined) {
    state.day = +b.dataset.next;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  if (b.dataset.filter) {
    state.filter = b.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(v => {
      v.classList.toggle('selected', v === b);
      v.setAttribute('aria-pressed', String(v === b));
    });
    placeResults();
  }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.speak) {
    const item = byId(b.dataset.speak);
    const text = item?.x[6];
    if (!('speechSynthesis' in window) || !text) {
      toast('이 브라우저는 음성 듣기를 지원하지 않습니다.');
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = langCode;
    u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang.startsWith(T.meta?.langPrefix || langCode.slice(0, 2)));
    if (voice) u.voice = voice;
    u.onerror = () => toast('음성 재생에 실패했습니다.');
    speechSynthesis.speak(u);
    toast(`${langName} 발음 재생 중`);
  }
  if (b.dataset.big) {
    const item = byId(b.dataset.big);
    if (!item) return;
    document.getElementById('modal-content').innerHTML = `
      <div class="display-native">${esc(item.x[6])}</div>
      <p class="reading">${esc(item.x[7])}</p>
      <p class="meaning">${esc(item.x[8])}</p>
      ${phraseControls(item.id).replace(/<button data-big=.*?<\/button>/, '')}
    `;
    document.getElementById('phrase-modal').showModal();
  }
  if (b.dataset.copy) {
    const item = byId(b.dataset.copy);
    if (!item) return;
    try {
      await navigator.clipboard.writeText(item.x[6]);
      toast(`${langName} 문장을 복사했습니다.`);
    } catch(err) {
      toast('클립보드 복사에 실패했습니다.');
    }
  }
});

const dialog = document.getElementById('phrase-modal');
dialog.querySelector('.close').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', e => {
  if (e.target === dialog) {
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
  }
});
dialog.addEventListener('close', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
});

initHeader();
render();
</script>
</body>
</html>
